# NOT TESTED in the build environment (no Docker there). Review before use.
# Usage: set TBOX_DOMAIN and TBOX_ADMIN_PASSWORD in .env, then: docker compose -f deploy/docker-compose.yml up -d
services:
  tbox:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      TBOX_ADMIN_PASSWORD: ${TBOX_ADMIN_PASSWORD:?set a strong initial admin password}
    volumes: [ "tbox-data:/data" ]
    expose: [ "8080" ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment: { TBOX_DOMAIN: "${TBOX_DOMAIN:?set your domain}" }
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data" ]
    depends_on: [ tbox ]
volumes: { tbox-data: {}, caddy-data: {} }
